<text x="1210" y="160.0" font-size="28" fill="#7D4BC2" text-anchor="start" font-weight="700">②' 理論上（r·s）</text>
<text x="1210" y="196.0" font-size="24" fill="#55595F" text-anchor="start" font-weight="400">= 物体が 1 マス/フレーム</text>
<text x="1210" y="226.0" font-size="24" fill="#55595F" text-anchor="start" font-weight="400">で動いたときの位置</text>
<text x="1210" y="516.25" font-size="28" fill="#E07B10" text-anchor="start" font-weight="700">② 2r = 6 マス</text>
<text x="1210" y="583.5" font-size="28" fill="#7D4BC2" text-anchor="start" font-weight="700">②' 実効（≈ σ√s）</text>
<text x="1210" y="619.5" font-size="24" fill="#55595F" text-anchor="start" font-weight="400">s=8 で約 2.3〜2.8 マス</text>
<text x="60" y="845" font-size="24" fill="#55595F" text-anchor="start" font-weight="400">設定例：② は k=7（r=3）、②' は 3×3（r=1）。Mamba の減衰による弱まりは描いていない。</text>
<text x="60" y="880" font-size="24" fill="#55595F" text-anchor="start" font-weight="400">実効範囲は固定カーネルを s 回畳み込んだときの広がり（中心極限定理による推論）。</text>
